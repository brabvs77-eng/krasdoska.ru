name: Deploy (istra-kraski.ru) — retired

# Retired: all production deploys go to krashenayadoska.ru via production.yml.
# Kept as a no-op so old workflow links do not fail loudly.
on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Retired notice
        run: |
          echo "istra-kraski.ru deploy is retired."
          echo "Use Production Deploy (main → krashenayadoska.ru)."
          exit 0
