name: Deploy (istra-kraski.ru)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/istra-deploy.yml"

concurrency:
  group: deploy-istra-kraski
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FETCH_UPLOADS_MAX_MISS: "0"
      DEPLOY_HOST: ${{ secrets.ISTRA_SSH_HOST || secrets.SSH_HOST }}
      DEPLOY_USER: ${{ secrets.ISTRA_SSH_USER || secrets.SSH_USER }}
      DEPLOY_PORT: ${{ secrets.ISTRA_SSH_PORT || secrets.SSH_PORT || 22 }}
      DEPLOY_WEBROOT: ${{ secrets.ISTRA_WEBROOT || '/var/www/istra-kraski.ru' }}
      # Accept common private-key secret names.
      DEPLOY_KEY: ${{ secrets.ISTRA_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || secrets.ISTRA_SSH_KEY || secrets.SSH_KEY }}
    steps:
      - name: Check deploy secrets
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_WEBROOT DEPLOY_KEY; do
            value="${!name}"
            if [ -z "${value// }" ]; then
              echo "::error::$name is empty — set the matching GitHub Actions secret"
              missing=1
            else
              echo "$name: ok (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Need secrets: ISTRA_SSH_HOST, ISTRA_SSH_USER, ISTRA_SSH_PRIVATE_KEY (or SSH_*), optional ISTRA_SSH_PORT / ISTRA_WEBROOT"
            exit 1
          fi
          case "$DEPLOY_KEY" in
            *"BEGIN"*PRIVATE*KEY*)
              echo "DEPLOY_KEY: looks like a private key PEM"
              ;;
            *)
              echo "::error::DEPLOY_KEY does not look like a private key (must include BEGIN ... PRIVATE KEY)"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - name: Upload refs cache key
        id: uploads-cache-key
        working-directory: site
        run: |
          HASH=$(find lib content components app -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.json' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "key=uploads-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore uploads cache
        uses: actions/cache@v4
        with:
          path: site/public/uploads
          key: ${{ runner.os }}-${{ steps.uploads-cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-uploads-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm install
      - run: npm run build

      - name: Ensure webroot exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_WEBROOT }}"
            mkdir -p ~/backups

      - name: Backup current site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            if [ -d "$TARGET" ] && [ "$(ls -A "$TARGET" 2>/dev/null || true)" ]; then
              BACKUP_DIR=~/backups/istra-kraski-$(date +%Y%m%d-%H%M%S)
              mkdir -p "$BACKUP_DIR"
              cp -a "$TARGET" "$BACKUP_DIR/"
            fi

      - name: Remove old build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            mkdir -p "$TARGET"
            find "$TARGET" -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +

      - name: Deploy static build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: "site/out/"
          target: ${{ env.DEPLOY_WEBROOT }}/
          strip_components: 2
          overwrite: true

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            chown -R "$(whoami):$(whoami)" "$TARGET" || true
            find "$TARGET" -type d -exec chmod 755 {} +
            find "$TARGET" -type f -exec chmod 644 {} +
