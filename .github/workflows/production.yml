name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/production.yml"
  workflow_dispatch:

concurrency:
  group: production-krashenayadoska
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FETCH_UPLOADS_MAX_MISS: "0"
      DEPLOY_HOST: ${{ secrets.SSH_HOST || secrets.ISTRA_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER || secrets.ISTRA_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.SSH_PORT || secrets.ISTRA_SSH_PORT || 22 }}
      # Prefer explicit webroot secret; default to Beget-style path for krashenayadoska.ru
      DEPLOY_WEBROOT: ${{ secrets.SSH_WEBROOT || secrets.ISTRA_WEBROOT || secrets.DEPLOY_WEBROOT || '/var/www/u3070106/data/www/krashenayadoska.ru' }}
      DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.ISTRA_SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.ISTRA_SSH_KEY }}
      SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 || secrets.ISTRA_SSH_KEY_B64 }}
      SSH_KEY_PATH: /home/runner/.ssh/krashenayadoska_deploy_key
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        working-directory: .
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_WEBROOT; do
            value="${!name}"
            if [ -z "${value// }" ]; then
              echo "::error::$name is empty"
              missing=1
            else
              echo "$name: ok (length ${#value})"
            fi
          done
          echo "DEPLOY_WEBROOT path: $DEPLOY_WEBROOT"
          if [[ "$DEPLOY_USER" == *@* ]]; then
            echo "::warning::DEPLOY_USER looks like an email. SSH needs a Linux username."
          fi

          key=""
          if [ -n "${DEPLOY_KEY// }" ]; then
            key="$DEPLOY_KEY"
            echo "Using PEM secret"
          elif [ -n "${SSH_KEY_B64// }" ]; then
            raw="$(printf '%s' "$SSH_KEY_B64" | tr -d '\r')"
            case "$raw" in
              *"BEGIN"*PRIVATE*KEY*)
                echo "SSH_KEY_B64 contains PEM — using as-is"
                key="$raw"
                ;;
              *)
                echo "Decoding SSH_KEY_B64..."
                cleaned="$(printf '%s' "$raw" | tr -d '\n\t ')"
                key="$(printf '%s' "$cleaned" | base64 --decode --ignore-garbage)"
                ;;
            esac
          else
            echo "::error::No private key. Set SSH_KEY_B64 or SSH_PRIVATE_KEY"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          if [[ "$key" == *'\\n'* ]] || [[ "$key" == *'BEGIN'* && "$key" != *$'\n'* ]]; then
            key="$(printf '%b' "${key//$'\n'/\\n}")"
          fi
          key="$(printf '%s' "$key" | tr -d '\r')"
          key="${key%"$'\n'"}"$'\n'

          mkdir -p "$(dirname "$SSH_KEY_PATH")"
          printf '%s' "$key" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

          if ! ssh-keygen -y -f "$SSH_KEY_PATH" >/tmp/deploy.pub 2>/tmp/keygen.err; then
            echo "::error::Private key is invalid for OpenSSH:"
            cat /tmp/keygen.err
            exit 1
          fi
          echo "Private key OK"
          echo "Public fingerprint: $(ssh-keygen -lf /tmp/deploy.pub | awk '{print $1" "$2}')"

      - name: Upload refs cache key
        id: uploads-cache-key
        working-directory: site
        run: |
          HASH=$(find lib content components app -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.json' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "key=uploads-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore uploads cache
        uses: actions/cache@v4
        with:
          path: site/public/uploads
          key: ${{ runner.os }}-${{ steps.uploads-cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-uploads-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm install
      - run: npm run build

      - name: Ensure webroot exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: ${{ env.SSH_KEY_PATH }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            echo "Logged in as $(whoami)@$(hostname)"
            mkdir -p "${{ env.DEPLOY_WEBROOT }}"
            mkdir -p ~/backups

      - name: Backup current site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: ${{ env.SSH_KEY_PATH }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            if [ -d "$TARGET" ] && [ "$(ls -A "$TARGET" 2>/dev/null || true)" ]; then
              BACKUP_DIR=~/backups/krashenayadoska-$(date +%Y%m%d-%H%M%S)
              mkdir -p "$BACKUP_DIR"
              cp -a "$TARGET" "$BACKUP_DIR/"
            fi

      - name: Remove old build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: ${{ env.SSH_KEY_PATH }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            mkdir -p "$TARGET"
            find "$TARGET" -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +

      - name: Deploy static build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: ${{ env.SSH_KEY_PATH }}
          port: ${{ env.DEPLOY_PORT }}
          source: "site/out/"
          target: ${{ env.DEPLOY_WEBROOT }}/
          strip_components: 2
          overwrite: true

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: ${{ env.SSH_KEY_PATH }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            TARGET="${{ env.DEPLOY_WEBROOT }}"
            chown -R "$(whoami):$(whoami)" "$TARGET" || true
            find "$TARGET" -type d -exec chmod 755 {} +
            find "$TARGET" -type f -exec chmod 644 {} +
