# Static Next.js export for krashenayadoska.ru (FastPanel)
# Paste into the site nginx config and reload: nginx -t && systemctl reload nginx

server {
    server_name krashenayadoska.ru www.krashenayadoska.ru;

    listen 192.168.0.151:443 ssl;
    http2 on;

    ssl_certificate "/var/www/httpd-cert/krashenayadoska.ru_2025-10-23-16-56_31.crt";
    ssl_certificate_key "/var/www/httpd-cert/krashenayadoska.ru_2025-10-23-16-56_31.key";
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;

    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/xml application/javascript text/plain application/json image/svg+xml image/x-icon;
    gzip_comp_level 5;

    set $root_path /var/www/u3070106/data/www/krashenayadoska.ru;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    # Static site: index.html first, no PHP front-controller
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed Next assets — long cache
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|mp4|webm|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # PHP left available only if panel/tools still need it — not used for routing
    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/var/run/krashenayadoska.ru.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    include "/etc/nginx/fastpanel2-sites/u3070106/krashenayadoska.ru.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/u3070106/data/logs/krashenayadoska.ru-frontend.error.log;
    access_log /var/www/u3070106/data/logs/krashenayadoska.ru-frontend.access.log;
}

server {
    server_name krashenayadoska.ru www.krashenayadoska.ru;
    listen 192.168.0.151:80;
    return 301 https://$host$request_uri;

    error_log /var/www/u3070106/data/logs/krashenayadoska.ru-frontend.error.log;
    access_log /var/www/u3070106/data/logs/krashenayadoska.ru-frontend.access.log;
}
